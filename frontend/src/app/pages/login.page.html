<section class="auth-layout">
  <div class="auth-card" data-auth-card>
    <a class="auth-store-link" routerLink="/">
      <span aria-hidden="true">←</span> Volver a la tienda
    </a>
    <a class="auth-brand" routerLink="/" aria-label="Licorería Sureño — inicio">
      <img src="/logo-text.webp" alt="Licorería Sureño" width="240" height="68" />
    </a>
      <p class="eyebrow">Tu cuenta Sureño</p>
      <h1 class="section-title">Qué gusto verte.</h1>
      <p class="auth-description">Inicia sesión para consultar tu perfil y explorar el catálogo.</p>

      <form class="auth-form" (ngSubmit)="submit()">
        <div class="field">
          <label for="username">Usuario</label>
          <input id="username" name="username" type="text" autocomplete="username" required minlength="3" [(ngModel)]="username" />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required [(ngModel)]="password" />
        </div>
        @if (error) {
          <p class="form-message error-message" role="alert">{{ error }}</p>
        }
        <button class="button-primary submit-button" type="submit" [disabled]="loading || !username.trim() || !password">
          {{ loading ? 'Ingresando…' : 'Iniciar sesión' }}
        </button>
      </form>

      <p class="auth-switch">¿Aún no tienes cuenta? <a routerLink="/registro">Regístrate aquí</a></p>
      <p class="auth-age">El registro y las compras están destinados a personas mayores de 18 años.</p>
  </div>
</section>
