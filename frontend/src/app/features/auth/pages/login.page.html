<section
  class="auth-layout grid flex-1 min-h-[100svh] place-items-center p-[clamp(1rem,4vw,3rem)] max-[520px]:p-3"
>
  <div
    class="auth-card w-[min(100%,640px)] rounded-[4px] p-[clamp(1.35rem,4vw,2.9rem)] max-[520px]:p-5"
    data-auth-card
  >
    <div class="auth-topbar flex items-center justify-between gap-4">
      <a
        class="auth-store-link inline-flex items-center gap-[0.65rem] text-[var(--muted)] text-[0.66rem] font-bold tracking-[0.18em] no-underline uppercase"
        routerLink="/"
      >
        <span aria-hidden="true">←</span> Volver a la tienda
      </a>
      <button
        class="auth-theme-toggle"
        type="button"
        [attr.aria-label]="
          theme.theme() === 'light' ? 'Cambiar a modo oscuro' : 'Cambiar a modo claro'
        "
        [attr.aria-pressed]="theme.theme() === 'dark'"
        (click)="theme.toggle()"
      >
        @if (theme.theme() === 'light') {
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <path d="M20.1 15.4A8.5 8.5 0 0 1 8.6 3.9 8.5 8.5 0 1 0 20.1 15.4Z" />
          </svg>
        } @else {
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="3.8" />
            <path
              d="M12 2v2.2m0 15.6V22m10-10h-2.2M4.2 12H2m17.1-7.1-1.6 1.6M6.5 17.5l-1.6 1.6m14.2 0-1.6-1.6M6.5 6.5 4.9 4.9"
            />
          </svg>
        }
      </button>
    </div>
    <a
      class="auth-brand mt-8 mb-[2.3rem] flex justify-center"
      routerLink="/"
      aria-label="Licorería Sureño — inicio"
    >
      <img
        class="block w-[clamp(180px,50%,280px)] h-auto"
        src="/logo-text.webp"
        alt="Licorería Sureño"
        width="240"
        height="68"
      />
    </a>
    <p class="eyebrow flex justify-center m-0 mb-4 text-[var(--secondary)]">Tu cuenta Sureño</p>
    <h1 class="section-title text-[var(--paper)] text-center">Qué gusto verte.</h1>
    <p class="auth-description mt-4 mb-8 text-[var(--muted)] leading-[1.7] text-center">
      Inicia sesión para consultar tu perfil y explorar el catálogo.
    </p>

    <form class="auth-form grid gap-[1.15rem]" (ngSubmit)="submit()">
      <div class="field">
        <label for="username">Usuario</label>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          required
          minlength="3"
          [(ngModel)]="username"
        />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          [(ngModel)]="password"
        />
      </div>
      @if (error) {
        <p class="form-message error-message m-0 text-[0.9rem] leading-[1.55]" role="alert">
          {{ error }}
        </p>
      }
      <button
        class="button-primary submit-button w-full !min-h-[54px] mt-[0.35rem]"
        type="submit"
        [disabled]="loading || !username.trim() || !password"
      >
        {{ loading ? 'Ingresando…' : 'Iniciar sesión' }}
      </button>
    </form>

    <p
      class="auth-switch mt-[1.6rem] mb-0 border-t border-[var(--line)] pt-[1.4rem] text-[var(--muted)] text-[0.9rem] text-center"
    >
      ¿Aún no tienes cuenta? <a routerLink="/registro">Regístrate aquí</a>
    </p>
    <p class="auth-age mt-6 mb-0 text-[var(--muted-dim)] text-[0.76rem] leading-[1.65] text-center">
      El registro y las compras están destinados a personas mayores de 18 años.
    </p>
  </div>
</section>
