<header class="site-header">
  <div class="header-inner">
    <a class="brand" routerLink="/" aria-label="Licorería Sureño — inicio" (click)="closeMenu()">
      <img src="/logo-text.webp" alt="Licorería Sureño" width="140" height="40" />
    </a>

    <button
      class="menu-toggle"
      type="button"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="main-navigation"
      [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
      (click)="toggleMenu()"
    >
      <span></span><span></span><span></span>
    </button>

    <nav id="main-navigation" class="main-navigation" [class.is-open]="menuOpen()" aria-label="Navegación principal">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Inicio</a>
      <a routerLink="/quienes-somos" routerLinkActive="active" (click)="closeMenu()">Quiénes somos</a>
      <a routerLink="/catalogo" routerLinkActive="active" (click)="closeMenu()">Catálogo</a>
      <a class="nav-account" routerLink="/login" routerLinkActive="active" (click)="closeMenu()">
        {{ auth.user() ? 'Mi cuenta' : 'Iniciar sesión' }}
      </a>
    </nav>
  </div>
</header>

<main id="contenido-principal">
  <router-outlet></router-outlet>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <img src="/logo-text.webp" alt="Licorería Sureño" width="140" height="40" loading="lazy" />
      <span class="footer-location">Quito, Ecuador</span>
    </div>
    <div class="footer-links">
      <a routerLink="/quienes-somos">Nuestra historia</a>
      <a routerLink="/catalogo">Explorar catálogo</a>
      <a routerLink="/registro">Crear cuenta</a>
    </div>
    <p class="footer-legal">© 2026 Licorería Sureño. El consumo de alcohol es exclusivo para mayores de 18 años.</p>
  </div>
</footer>
